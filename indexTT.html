 <!DOCTYPE html>


<html>
    <head>
        
        <title> Table tag</title>
        
    </head>
    <body>
        <center><h1>Display  all students info here</h1></center><hr>
        <center>
            <table   border="3">
                <thead>
                    <th style="background-color: red;" colspan="3">Student Information</th>
                    <tr style="background-color: rgb(0, 255, 242);" >
                        <th>Name</th>
                        <th>Age</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="background-color: rgb(8, 198, 151);" rowspan="2"><img src="Pavan.jpg" alt="Pavan" height="40" width="40" border="2"><br>Pavan Patil  </td>
                        <td rowspan="2">20</td>
                        <td>A</td>
                    </tr>
                    <tr>
                        <td>B</td>
                    </tr>
                    <tr>
                        <td rowspan="2" style="background-color: rgb(79, 173, 224);" > <img src="Jayesh.jpeg" alt="Jayesh" height="40" width="40" border="2"><br>Jayesh Patil</td>
                        <td rowspan="2">21</td>
                        <td>C</td>
                    </tr>
                    <tr>
                        <td>D</td>
                    </tr>

                    
                </tbody>
            </table>
        </center>

        


    </body>
</html>
